<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParkSense – ป้ายแสดงที่จอดรถ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#dbe3ee;--g:#22c55e;--r:#ef4444;--road:#cbd5e1;--glow:.35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080e1a;--card:#111a2c;--tx:#e8eef8;--mu:#8b9bb4;--bd:#223049;--road:#1b2638;--glow:.6}}
:root[data-theme="dark"]{--bg:#080e1a;--card:#111a2c;--tx:#e8eef8;--mu:#8b9bb4;--bd:#223049;--road:#1b2638;--glow:.6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 340px at 50% -100px,#14b8a633,transparent),var(--bg);color:var(--tx);font-family:'Prompt',system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lg{display:flex;gap:10px;align-items:center}.lg i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0f766e,#1e3a8a);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;box-shadow:0 6px 14px #0f766e55}
.lg b{display:block;font-size:18px;line-height:1.1}.lg small{color:var(--mu);font-size:12px}
.rt{text-align:right;font-size:13px;color:var(--mu)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:#ef444422;color:#ef4444;margin-right:6px}
.live b{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.25;transform:scale(1.6)}}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#0f766e,#1e3a8a);color:#fff;border-radius:20px;padding:18px 20px;box-shadow:0 14px 30px #0f766e44;margin-bottom:14px}
.sum small{opacity:.85}.sum h2{margin:2px 0 0;font-size:19px}.big{font-size:48px;font-weight:600;line-height:1;text-align:right}
.gl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:500}
.lamp{width:44px;height:44px;border-radius:50%;flex:none;transition:.3s;border:3px solid #fff4}
.lamp.g{background:var(--g);box-shadow:0 0 0 4px #22c55e33,0 0 24px 4px rgba(34,197,94,var(--glow))}
.lamp.r{background:var(--r);box-shadow:0 0 0 4px #ef444433,0 0 24px 4px rgba(239,68,68,var(--glow));animation:pulse 1.4s infinite}
@keyframes pulse{50%{filter:brightness(1.3)}}
.gl .lamp{width:20px;height:20px;border-width:2px}
.bld{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #0f172a14}
.roof{height:14px;background:repeating-linear-gradient(135deg,#64748b 0 10px,#94a3b8 10px 20px);opacity:.55}
.fl{padding:14px 16px;border-top:1px solid var(--bd)}.fl:first-of-type{border-top:0}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.hd b{font-size:18px}.hd small{display:block;color:var(--mu);font-size:12px}.cnt{margin-left:auto;text-align:right}.cnt b{font-size:30px;line-height:1}
.sp{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.sp i{aspect-ratio:1;border-radius:5px;transition:background .3s}
.sp i.f{background:var(--g)}.sp i.o{background:var(--r)}.sp i.fl2{animation:fl 1.4s}
@keyframes fl{0%{transform:scale(1.7);box-shadow:0 0 0 0 #fff}100%{transform:scale(1);box-shadow:0 0 0 10px #fff0}}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lane{position:relative;overflow:hidden;height:64px;border-radius:14px;background:var(--road) repeating-linear-gradient(90deg,transparent 0 18px,#ffffff44 18px 34px) center/100% 3px no-repeat;border:1px solid var(--bd)}
.lane em{position:absolute;left:10px;top:6px;font-style:normal;font-size:12px;color:var(--mu);font-weight:500}
.lane u{position:absolute;top:24px;font-size:28px;text-decoration:none;opacity:0;left:-12%}
.lane u.in.go{animation:drive 2.2s linear}.lane u.out.go{animation:back 2.2s linear;transform:scaleX(-1)}
@keyframes drive{0%{left:-12%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:104%;opacity:0}}
@keyframes back{0%{left:104%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:-12%;opacity:0}}
.tk{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:13px}
.tk b{display:block;margin-bottom:4px}.tk div{padding:5px 0;border-top:1px solid var(--bd);color:var(--mu)}.tk div:first-of-type{color:var(--tx)}
.lgd{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mu);margin-top:14px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.hide{display:none!important}
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;position:relative;background:radial-gradient(circle at 18% 12%,#2dd4bf66,transparent 42%),radial-gradient(circle at 88% 82%,#60a5fa66,transparent 46%),linear-gradient(135deg,#0f766e,#1e3a8a)}
.land .ico{width:84px;height:84px;border-radius:26px;background:#ffffff26;display:grid;place-items:center;font-size:44px;border:1px solid #fff4;margin-bottom:16px;box-shadow:0 12px 30px #0003}
.land h1{margin:0;font-size:34px}.land p{margin:6px 0 22px;opacity:.9}
.tz{display:flex;align-items:center;gap:12px;background:#ffffff1f;border:1px solid #fff3;border-radius:18px;padding:12px 18px;margin-bottom:22px}.tz .lamp{width:22px;height:22px;border-width:2px}.tz b{font-size:26px}
.enter{border:0;background:#fff;color:#0f766e;font:inherit;font-weight:600;font-size:17px;padding:14px 28px;border-radius:99px;box-shadow:0 10px 26px #0004;cursor:pointer}.enter:active{transform:scale(.96)}
.land small{margin-top:14px;opacity:.85}
.cars{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:26px;letter-spacing:4px}
/* ---- ตกแต่งเพิ่ม ---- */
.land{overflow:hidden}
.land::after{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;background:#0000002e;border-top:3px dashed #ffffff55}
.land .ico{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.land h1{font-size:38px;letter-spacing:1px;text-shadow:0 6px 20px #0004}
.tz{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 26px #0002}
.enter{animation:glw 2s infinite}@keyframes glw{50%{box-shadow:0 10px 26px #0004,0 0 0 10px #ffffff2a}}
.cars{left:0;width:max-content;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1;animation:mv 14s linear infinite}@keyframes mv{from{transform:translateX(-110%)}to{transform:translateX(100vw)}}
.sum{position:relative;overflow:hidden}.sum::before{content:'';position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:#ffffff14}.sum>*{position:relative}
.pbar{height:8px;border-radius:9px;background:var(--bd);margin:-4px 8px 14px;overflow:hidden}.pbar b{display:block;height:100%;width:0;border-radius:9px;transition:width .6s,background .6s}
.bld{box-shadow:0 18px 44px #0f172a26}
.roof{height:34px;opacity:1;background:linear-gradient(135deg,#0f766e,#1e3a8a);display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:6px;font-size:13px}.roof::before{content:'🅿️  PARKING'}
.fl{background:linear-gradient(90deg,#22c55e18,transparent 65%);box-shadow:inset 5px 0 0 var(--g);transition:background .4s}
.fl.full{background:linear-gradient(90deg,#ef444420,transparent 65%);box-shadow:inset 5px 0 0 var(--r)}
.lamp{position:relative}.lamp::after{content:'';position:absolute;top:16%;left:20%;width:32%;height:24%;border-radius:50%;background:#fff7;transform:rotate(-30deg)}
.sp i{border-radius:7px;box-shadow:inset 0 -3px 0 #0003;display:grid;place-items:center;font-style:normal;font-size:clamp(10px,3.3vw,17px);line-height:1}
.sp i.f::after{content:'P';color:#ffffffaa;font-weight:600}.sp i.o::after{content:'🚗'}
.lane{background:linear-gradient(#475569,#334155);border-color:#334155;box-shadow:inset 0 3px 8px #0005}.lane::before{content:'';position:absolute;left:0;right:0;top:55%;border-top:3px dashed #ffffff77}.lane em{color:#e2e8f0;z-index:1}.lane u{z-index:1}
.tk{box-shadow:0 8px 20px #0f172a10}
.chev{font-size:26px;color:var(--mu);margin-left:6px;line-height:1}.fl{cursor:pointer}.fl:active{filter:brightness(.97)}
.dg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px}
.tl{aspect-ratio:3/4;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 -4px 0 #0003;font-size:12px}.tl b{font-size:18px}.tl span{font-size:14px}.tl.f{background:var(--g)}.tl.o{background:var(--r)}.tl.fl2{animation:fl 1.4s}
.note{text-align:center;color:var(--mu);font-size:13px;margin:14px 0}
.enter.back{display:block;margin:0 auto;background:linear-gradient(135deg,#0f766e,#1e3a8a);color:#fff;animation:none}
@media(max-width:520px){.sp{gap:4px}.big{font-size:40px}}
</style>
</head>
<body>
<div class="land" id="land"><div class="ico">🅿️</div><h1>ParkSense</h1><p>ระบบตรวจสอบที่จอดรถแบบเรียลไทม์</p><div class="tz"><span class="lamp g" id="ll"></span><span>ตอนนี้ว่าง <b id="lt">0</b> ช่อง</span></div><button class="enter" onclick="enter()">เข้าดูสถานะที่จอดรถ ➜</button><small>ไม่ต้องลงทะเบียน ดูได้ทันที</small><div class="cars">🚗 🚙 🚕 🚌 🚓</div></div>
<div class="wrap hide" id="main">
<header><div class="lg" onclick="home()" style="cursor:pointer" title="กลับหน้าแรก"><i>P</i><div><b>ParkSense</b><small>ป้ายแสดงสถานะที่จอดรถ</small></div></div><div class="rt"><span class="live"><b></b>LIVE</span><span id="clk"></span></div></header>
<div class="sum"><div><small>ที่จอดว่างทั้งอาคาร</small><h2>ทางเข้า</h2><div class="gl"><span class="lamp g" id="gl"></span><span id="gt">เปิดรับรถ</span></div></div><div><div class="big" id="tot">0</div><small id="all"></small></div></div><div class="pbar"><b id="pb"></b></div>
<section class="bld"><div class="roof"></div><div id="bld"></div></section>
<div class="rd"><div class="lane"><em>⬇ ทางเข้า</em><u class="in" id="cin">🚗</u></div><div class="lane"><em>ทางออก ⬆</em><u class="out" id="cout">🚙</u></div></div>
<div class="tk"><b>📡 รถเข้า-ออกล่าสุด</b><span id="tk"></span></div>
<div class="lgd"><span><i style="background:var(--g)"></i>ว่าง</span><span><i style="background:var(--r)"></i>ไม่ว่าง</span></div>
</div>
<script>
const FL=['ชั้น 1','ชั้น 2','ชั้น 3','ชั้น 4'],N=10,$=id=>document.getElementById(id);
let cf=null,sp=FL.map((_,f)=>Array.from({length:N},()=>Math.random()<[.75,.6,.4,.25][f]?1:0)),logs=[];
const nf=f=>sp[f].filter(x=>!x).length,tm=()=>new Date().toLocaleTimeString('th-TH');
$('bld').innerHTML=[3,2,1,0].map(f=>`<div class="fl" onclick="openF(${f})"><div class="hd"><span class="lamp g" id="lp${f}"></span><div><b>${FL[f]}</b><small id="st${f}"></small></div><div class="cnt"><b id="ct${f}"></b><small>ว่าง / ${N}</small></div><span class="chev">›</span></div><div class="sp">${sp[f].map((_,i)=>`<i id="s${f}-${i}" title="ช่อง ${i+1}"></i>`).join('')}</div></div>`).join('');
function paint(f,i,flash){if(i!=null){const e=$(`s${f}-${i}`);e.className=sp[f][i]?'o':'f';if(flash){e.classList.remove('fl2');void e.offsetWidth;e.classList.add('fl2')}}
 const fr=nf(f);$('ct'+f).textContent=fr;$('lp'+f).className='lamp '+(fr?'g':'r');$('st'+f).textContent=fr===0?'เต็ม':fr/N>.25?'ว่าง':'เกือบเต็ม';
 const t=FL.reduce((s,_,k)=>s+nf(k),0);$('tot').textContent=t;const u=Math.round(100-t/(N*FL.length)*100);$('all').textContent='จาก '+N*FL.length+' ช่อง · ใช้งาน '+u+'%';$('pb').style.width=u+'%';$('pb').style.background=u<60?'#22c55e':u<85?'#f59e0b':'#ef4444';$('lp'+f).closest('.fl').classList.toggle('full',!fr);$('gl').className='lamp '+(t?'g':'r');$('gt').textContent=t?'เปิดรับรถ':'ที่จอดเต็ม';$('lt').textContent=t;$('ll').className='lamp '+(t?'g':'r');if(cf===f)drawD(i,flash)}
sp.forEach((r,f)=>{r.forEach((_,i)=>paint(f,i,0))});
function car(id){const e=$(id);e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}
function evt(){const t=FL.reduce((s,_,f)=>s+nf(f),0),p=Math.min(.85,Math.max(.15,t/(N*FL.length))),enter=t>0&&Math.random()<p,want=enter?0:1;
 let c=[];sp.forEach((r,f)=>r.forEach((v,i)=>{if(v===want)c.push([f,i])}));
 if(c.length){if(enter&&Math.random()<.6){const lo=Math.min(...c.map(x=>x[0]));c=c.filter(x=>x[0]===lo)}
  const [f,i]=c[Math.floor(Math.random()*c.length)];sp[f][i]=enter?1:0;paint(f,i,1);car(enter?'cin':'cout');
  logs.unshift(`${tm()} · ${enter?'➡️ รถเข้า':'⬅️ รถออก'} ${FL[f]} ช่อง ${i+1}`);logs=logs.slice(0,5);$('tk').innerHTML=logs.map(l=>`<div>${l}</div>`).join('')}
 setTimeout(evt,1200+Math.random()*1800)}
function enter(){$('land').classList.add('hide');$('main').classList.remove('hide');scrollTo(0,0)}
/* ---- กดเข้าดูแต่ละชั้น (ดูอย่างเดียว ไม่มีระบบจอง) ---- */
document.body.insertAdjacentHTML('beforeend',`<div class="wrap hide" id="det"><header><div class="lg" onclick="closeF()" style="cursor:pointer"><i>‹</i><div><b id="dt">ชั้น</b><small>ดูสถานะเท่านั้น · ไม่สามารถจองได้</small></div></div><div class="rt"><span class="live"><b></b>LIVE</span></div></header><div class="sum"><div><small>ที่ว่างในชั้นนี้</small><div class="gl"><span class="lamp g" id="dl"></span><span id="ds"></span></div></div><div><div class="big" id="dc">0</div><small id="dn"></small></div></div><div class="bld"><div class="roof"></div><div class="dg" id="dg"></div></div><div class="note">👀 โหมดดูอย่างเดียว ไม่มีระบบจองช่องจอด</div><button class="enter back" onclick="closeF()">‹ กลับไปดูทุกชั้น</button></div>`);
function drawD(ch,fx){if(cf==null)return;const fr=nf(cf);$('dt').textContent=FL[cf];$('dc').textContent=fr;$('dn').textContent='จาก '+N+' ช่อง';$('dl').className='lamp '+(fr?'g':'r');$('ds').textContent=fr?'มีที่ว่าง':'ชั้นนี้เต็ม';$('dg').innerHTML=sp[cf].map((v,i)=>`<div class="tl ${v?'o':'f'}${fx&&i===ch?' fl2':''}"><b>${String(i+1).padStart(2,'0')}</b><span>${v?'🚗':'ว่าง'}</span></div>`).join('')}
function openF(f){cf=f;drawD();$('main').classList.add('hide');$('det').classList.remove('hide');scrollTo(0,0)}
function closeF(){cf=null;$('det').classList.add('hide');$('main').classList.remove('hide');scrollTo(0,0)}
function home(){$('main').classList.add('hide');$('land').classList.remove('hide');scrollTo(0,0)}
setInterval(()=>{$('clk').textContent=tm()},1000);$('clk').textContent=tm();
setTimeout(evt,800);
</script>
</body>
</html>
